<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140" role="img" aria-label="Calendar with every other Tuesday highlighted showing a recurring bi-weekly pattern">
  <defs>
    <linearGradient id="bg-rp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0176d3"/>
      <stop offset="1" stop-color="#032e61"/>
    </linearGradient>
  </defs>
  <rect width="200" height="140" fill="url(#bg-rp)"/>
  <!-- pattern label -->
  <g transform="translate(20 20)">
    <text x="0" y="0" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="rgba(255,255,255,0.95)" letter-spacing="0.5">EVERY OTHER TUESDAY</text>
  </g>
  <!-- month calendar -->
  <g transform="translate(20 30)">
    <!-- day headers -->
    <g fill="rgba(255,255,255,0.6)" font-family="system-ui,sans-serif" font-size="7" font-weight="700" letter-spacing="0.5">
      <text x="10" y="8" text-anchor="middle">S</text>
      <text x="32" y="8" text-anchor="middle">M</text>
      <text x="54" y="8" text-anchor="middle">T</text>
      <text x="76" y="8" text-anchor="middle">W</text>
      <text x="98" y="8" text-anchor="middle">T</text>
      <text x="120" y="8" text-anchor="middle">F</text>
      <text x="142" y="8" text-anchor="middle">S</text>
    </g>
    <!-- calendar cells 5 rows × 7 cols. Highlight Tuesdays: 4, 18 (every-other) -->
    <g font-family="system-ui,sans-serif" font-size="7" fill="rgba(255,255,255,0.85)">
      <!-- row 1: 1-7 -->
      <g transform="translate(0 12)">
        <text x="10" y="9" text-anchor="middle">31</text>
        <text x="32" y="9" text-anchor="middle" font-weight="700" fill="rgba(255,255,255,0.7)">1</text>
        <text x="54" y="9" text-anchor="middle">2</text>
        <text x="76" y="9" text-anchor="middle">3</text>
        <rect x="94" y="1" width="12" height="12" rx="6" fill="#22c55e"/>
        <text x="100" y="9" text-anchor="middle" fill="#ffffff" font-weight="700">4</text>
        <text x="120" y="9" text-anchor="middle">5</text>
        <text x="142" y="9" text-anchor="middle">6</text>
      </g>
      <!-- row 2: 8-14 -->
      <g transform="translate(0 28)">
        <text x="10" y="9" text-anchor="middle">7</text>
        <text x="32" y="9" text-anchor="middle">8</text>
        <text x="54" y="9" text-anchor="middle">9</text>
        <text x="76" y="9" text-anchor="middle">10</text>
        <text x="98" y="9" text-anchor="middle">11</text>
        <text x="120" y="9" text-anchor="middle">12</text>
        <text x="142" y="9" text-anchor="middle">13</text>
      </g>
      <!-- row 3: 15-21, highlight 18 -->
      <g transform="translate(0 44)">
        <text x="10" y="9" text-anchor="middle">14</text>
        <text x="32" y="9" text-anchor="middle">15</text>
        <text x="54" y="9" text-anchor="middle">16</text>
        <text x="76" y="9" text-anchor="middle">17</text>
        <rect x="94" y="1" width="12" height="12" rx="6" fill="#22c55e"/>
        <text x="100" y="9" text-anchor="middle" fill="#ffffff" font-weight="700">18</text>
        <text x="120" y="9" text-anchor="middle">19</text>
        <text x="142" y="9" text-anchor="middle">20</text>
      </g>
      <!-- row 4: 22-28 -->
      <g transform="translate(0 60)">
        <text x="10" y="9" text-anchor="middle">21</text>
        <text x="32" y="9" text-anchor="middle">22</text>
        <text x="54" y="9" text-anchor="middle">23</text>
        <text x="76" y="9" text-anchor="middle">24</text>
        <text x="98" y="9" text-anchor="middle">25</text>
        <text x="120" y="9" text-anchor="middle">26</text>
        <text x="142" y="9" text-anchor="middle">27</text>
      </g>
      <!-- row 5: 29-31 -->
      <g transform="translate(0 76)">
        <text x="10" y="9" text-anchor="middle">28</text>
        <text x="32" y="9" text-anchor="middle">29</text>
        <text x="54" y="9" text-anchor="middle">30</text>
      </g>
    </g>
    <!-- connector line linking the two highlighted Tuesdays -->
    <path d="M100 20 Q 132 32 132 44 T 100 56" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.85"/>
  </g>
</svg>
