<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140" role="img" aria-label="Two overlapping event bars marked with a conflict indicator, showing double-booking prevention">
  <defs>
    <linearGradient id="bg-db" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0176d3"/>
      <stop offset="1" stop-color="#032e61"/>
    </linearGradient>
    <pattern id="stripe-db" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#ffffff" stroke-width="2" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="200" height="140" fill="url(#bg-db)"/>
  <!-- time axis -->
  <g transform="translate(20 24)" opacity="0.85">
    <text x="0" y="0" font-family="'Menlo','JetBrains Mono',monospace" font-size="7" fill="rgba(255,255,255,0.75)">9  10  11  12  1  2  3</text>
    <line x1="0" y1="5" x2="160" y2="5" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
    <g stroke="rgba(255,255,255,0.2)" stroke-width="0.7">
      <line x1="12" y1="5" x2="12" y2="80"/>
      <line x1="34" y1="5" x2="34" y2="80"/>
      <line x1="56" y1="5" x2="56" y2="80"/>
      <line x1="78" y1="5" x2="78" y2="80"/>
      <line x1="100" y1="5" x2="100" y2="80"/>
      <line x1="122" y1="5" x2="122" y2="80"/>
      <line x1="144" y1="5" x2="144" y2="80"/>
    </g>
  </g>
  <!-- Room A bar (10-12) -->
  <g transform="translate(20 44)">
    <text x="-8" y="8" font-family="system-ui,sans-serif" font-size="7" fill="rgba(255,255,255,0.85)" text-anchor="end" transform="translate(-2 0)">Room A</text>
    <rect x="18" y="0" width="52" height="14" rx="2.5" fill="#ffffff"/>
    <text x="44" y="10" font-family="system-ui,sans-serif" font-size="7" fill="#032e61" text-anchor="middle" font-weight="600">Booked</text>
  </g>
  <!-- Room A conflict bar (11-1) -->
  <g transform="translate(20 62)">
    <rect x="40" y="0" width="52" height="14" rx="2.5" fill="#ef4444"/>
    <rect x="40" y="0" width="52" height="14" rx="2.5" fill="url(#stripe-db)"/>
    <text x="66" y="10" font-family="system-ui,sans-serif" font-size="7" fill="#ffffff" text-anchor="middle" font-weight="700">CONFLICT</text>
  </g>
  <!-- overlap marker -->
  <g transform="translate(58 44)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#ef4444" stroke-width="2" stroke-dasharray="2 2"/>
    <line x1="14" y1="0" x2="14" y2="30" stroke="#ef4444" stroke-width="2" stroke-dasharray="2 2"/>
  </g>
  <!-- resolution hint -->
  <g transform="translate(20 100)">
    <rect width="160" height="24" rx="4" fill="rgba(255,255,255,0.94)"/>
    <g fill="#f97316" transform="translate(10 12)">
      <path d="M0 -7 L7 6 L-7 6 Z" stroke="#f97316" stroke-width="1"/>
      <text x="0" y="4" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
    </g>
    <text x="24" y="10" font-family="system-ui,sans-serif" font-size="8.5" font-weight="700" fill="#032e61">Overlap ≠ equality</text>
    <text x="24" y="19" font-family="system-ui,sans-serif" font-size="7.5" fill="#55606d">catch it at selection, not save</text>
  </g>
</svg>
