<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140" role="img" aria-label="MultiDatePick Setup Wizard: numbered step progress with a component-type picker and a live preview">
  <defs>
    <linearGradient id="bg-wiz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0176d3"/>
      <stop offset="1" stop-color="#032e61"/>
    </linearGradient>
  </defs>
  <rect width="200" height="140" fill="url(#bg-wiz)"/>
  <!-- wizard chrome panel -->
  <g transform="translate(12 12)">
    <rect width="176" height="116" rx="6" fill="rgba(255,255,255,0.96)"/>
    <!-- step indicator -->
    <g transform="translate(14 14)">
      <circle cx="0" cy="0" r="8" fill="#22c55e"/>
      <text x="0" y="3" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
      <line x1="8" y1="0" x2="30" y2="0" stroke="#22c55e" stroke-width="1.5"/>
      <circle cx="38" cy="0" r="8" fill="#22c55e"/>
      <text x="38" y="3" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
      <line x1="46" y1="0" x2="68" y2="0" stroke="#0176d3" stroke-width="1.5"/>
      <circle cx="76" cy="0" r="8" fill="#0176d3"/>
      <text x="76" y="3" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
      <line x1="84" y1="0" x2="106" y2="0" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="114" cy="0" r="8" fill="#e2e8f0"/>
      <text x="114" y="3" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">4</text>
      <line x1="122" y1="0" x2="144" y2="0" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="152" cy="0" r="8" fill="#e2e8f0"/>
      <text x="152" y="3" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">5</text>
    </g>
    <!-- component type cards -->
    <g transform="translate(14 36)">
      <rect x="0" y="0" width="48" height="34" rx="4" fill="#eff6ff" stroke="#0176d3" stroke-width="1"/>
      <rect x="52" y="0" width="48" height="34" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="104" y="0" width="48" height="34" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
      <!-- calendar mini -->
      <g transform="translate(16 8)" fill="#0176d3">
        <rect width="16" height="12" rx="1.5" opacity="0.15"/>
        <rect x="2" y="2" width="3" height="2" rx="0.5"/><rect x="6" y="2" width="3" height="2" rx="0.5"/><rect x="10" y="2" width="3" height="2" rx="0.5"/>
        <rect x="2" y="5" width="3" height="2" rx="0.5"/><rect x="6" y="5" width="3" height="2" rx="0.5"/><rect x="10" y="5" width="3" height="2" rx="0.5"/>
      </g>
      <!-- clock -->
      <g transform="translate(76 15)" stroke="#94a3b8" stroke-width="1.2" fill="none">
        <circle r="6"/>
        <line x1="0" y1="0" x2="0" y2="-4"/>
        <line x1="0" y1="0" x2="3" y2="1"/>
      </g>
      <!-- room -->
      <g transform="translate(128 8)" fill="#94a3b8">
        <rect width="16" height="14" rx="1.5" opacity="0.25"/>
        <rect x="2" y="2" width="5" height="4" rx="0.5"/>
        <rect x="9" y="2" width="5" height="4" rx="0.5"/>
        <rect x="2" y="8" width="5" height="4" rx="0.5"/>
        <rect x="9" y="8" width="5" height="4" rx="0.5"/>
      </g>
    </g>
    <!-- live preview label + mini calendar -->
    <g transform="translate(14 80)">
      <text x="0" y="0" font-family="system-ui,sans-serif" font-size="6.5" font-weight="700" fill="#55606d" letter-spacing="0.8">LIVE PREVIEW</text>
      <rect x="0" y="4" width="148" height="26" rx="3" fill="#f8fafc" stroke="#e2e8f0"/>
      <g transform="translate(6 8)" fill="#0176d3">
        <rect width="4" height="4" rx="0.5" opacity="0.3"/><rect x="6" width="4" height="4" rx="0.5" opacity="0.3"/>
        <rect x="12" width="4" height="4" rx="0.5"/>
        <rect x="18" width="4" height="4" rx="0.5" opacity="0.3"/><rect x="24" width="4" height="4" rx="0.5"/>
        <rect x="30" width="4" height="4" rx="0.5" opacity="0.3"/>
        <rect y="6" width="4" height="4" rx="0.5"/>
        <rect x="6" y="6" width="4" height="4" rx="0.5" opacity="0.3"/>
        <rect x="12" y="6" width="4" height="4" rx="0.5" opacity="0.3"/>
        <rect x="18" y="6" width="4" height="4" rx="0.5"/>
        <rect x="24" y="6" width="4" height="4" rx="0.5" opacity="0.3"/>
        <rect x="30" y="6" width="4" height="4" rx="0.5" opacity="0.3"/>
        <rect y="12" width="4" height="4" rx="0.5" opacity="0.3"/>
        <rect x="6" y="12" width="4" height="4" rx="0.5"/>
        <rect x="12" y="12" width="4" height="4" rx="0.5" opacity="0.3"/>
        <rect x="18" y="12" width="4" height="4" rx="0.5" opacity="0.3"/>
        <rect x="24" y="12" width="4" height="4" rx="0.5"/>
        <rect x="30" y="12" width="4" height="4" rx="0.5" opacity="0.3"/>
      </g>
      <text x="76" y="18" font-family="system-ui,sans-serif" font-size="7" fill="#55606d">4 dates picked</text>
    </g>
  </g>
</svg>
