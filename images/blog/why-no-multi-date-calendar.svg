<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140" role="img" aria-label="A single date field labeled Date with a red strikethrough, showing what one date field alone cannot capture">
  <defs>
    <linearGradient id="bg-why" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0176d3"/>
      <stop offset="1" stop-color="#032e61"/>
    </linearGradient>
  </defs>
  <rect width="200" height="140" fill="url(#bg-why)"/>
  <!-- 10-column workaround at top -->
  <g transform="translate(14 18)" opacity="0.7">
    <text x="0" y="0" font-family="'Menlo','JetBrains Mono',monospace" font-size="7" fill="rgba(255,255,255,0.65)" letter-spacing="0.5">Date__c, Date_2__c, Date_3__c...</text>
    <g fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="0.5">
      <rect x="0" y="6" width="16" height="10" rx="1.5"/>
      <rect x="18" y="6" width="16" height="10" rx="1.5"/>
      <rect x="36" y="6" width="16" height="10" rx="1.5"/>
      <rect x="54" y="6" width="16" height="10" rx="1.5"/>
      <rect x="72" y="6" width="16" height="10" rx="1.5"/>
      <rect x="90" y="6" width="16" height="10" rx="1.5"/>
      <rect x="108" y="6" width="16" height="10" rx="1.5"/>
      <rect x="126" y="6" width="16" height="10" rx="1.5"/>
      <rect x="144" y="6" width="16" height="10" rx="1.5"/>
      <rect x="162" y="6" width="10" height="10" rx="1.5"/>
    </g>
  </g>
  <!-- large single-date field with strike-through -->
  <g transform="translate(20 56)">
    <text x="0" y="0" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="rgba(255,255,255,0.85)" letter-spacing="0.8">DATE__C</text>
    <rect x="0" y="6" width="160" height="34" rx="5" fill="rgba(255,255,255,0.95)"/>
    <text x="14" y="30" font-family="system-ui,sans-serif" font-size="16" fill="#032e61" font-weight="500">2026-08-22</text>
    <!-- red strike -->
    <line x1="-4" y1="8" x2="164" y2="42" stroke="#f97316" stroke-width="3.5" stroke-linecap="round" opacity="0.95"/>
  </g>
  <!-- "10 dates need 10 fields — or a picker" caption -->
  <g transform="translate(20 116)" opacity="0.75">
    <text x="0" y="0" font-family="system-ui,sans-serif" font-size="8" fill="rgba(255,255,255,0.75)" font-weight="500">One field. One date. Every workaround leaks.</text>
  </g>
</svg>
