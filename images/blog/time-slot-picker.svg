<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140" role="img" aria-label="Time slot picker: a grid of 30-minute slots with several selected and one marked as booked">
  <defs>
    <linearGradient id="bg-ts" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0176d3"/>
      <stop offset="1" stop-color="#032e61"/>
    </linearGradient>
    <pattern id="closed-ts" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="200" height="140" fill="url(#bg-ts)"/>
  <!-- date header -->
  <g transform="translate(20 18)">
    <text x="0" y="0" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="rgba(255,255,255,0.95)" letter-spacing="0.5">FRIDAY, AUGUST 22</text>
  </g>
  <!-- time slot grid: 3 columns × 5 rows -->
  <g transform="translate(20 30)">
    <!-- row 1 -->
    <rect x="0" y="0" width="50" height="18" rx="3" fill="rgba(255,255,255,0.94)"/>
    <text x="25" y="12" font-family="system-ui,sans-serif" font-size="8" fill="#032e61" text-anchor="middle" font-weight="600">9:00</text>
    <rect x="55" y="0" width="50" height="18" rx="3" fill="rgba(255,255,255,0.94)"/>
    <text x="80" y="12" font-family="system-ui,sans-serif" font-size="8" fill="#032e61" text-anchor="middle" font-weight="600">9:30</text>
    <rect x="110" y="0" width="50" height="18" rx="3" fill="rgba(255,255,255,0.94)"/>
    <text x="135" y="12" font-family="system-ui,sans-serif" font-size="8" fill="#032e61" text-anchor="middle" font-weight="600">10:00</text>
    <!-- row 2 -->
    <rect x="0" y="22" width="50" height="18" rx="3" fill="rgba(255,255,255,0.94)"/>
    <text x="25" y="34" font-family="system-ui,sans-serif" font-size="8" fill="#032e61" text-anchor="middle" font-weight="600">10:30</text>
    <rect x="55" y="22" width="50" height="18" rx="3" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>
    <text x="80" y="34" font-family="system-ui,sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="700">11:00 ✓</text>
    <rect x="110" y="22" width="50" height="18" rx="3" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>
    <text x="135" y="34" font-family="system-ui,sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="700">11:30 ✓</text>
    <!-- row 3 -->
    <rect x="0" y="44" width="50" height="18" rx="3" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>
    <text x="25" y="56" font-family="system-ui,sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="700">12:00 ✓</text>
    <rect x="55" y="44" width="50" height="18" rx="3" fill="#f97316"/>
    <text x="80" y="56" font-family="system-ui,sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="700">12:30</text>
    <rect x="110" y="44" width="50" height="18" rx="3" fill="rgba(255,255,255,0.94)"/>
    <text x="135" y="56" font-family="system-ui,sans-serif" font-size="8" fill="#032e61" text-anchor="middle" font-weight="600">1:00</text>
    <!-- row 4: closed slots -->
    <rect x="0" y="66" width="50" height="18" rx="3" fill="rgba(255,255,255,0.35)"/>
    <rect x="0" y="66" width="50" height="18" rx="3" fill="url(#closed-ts)"/>
    <rect x="55" y="66" width="50" height="18" rx="3" fill="rgba(255,255,255,0.35)"/>
    <rect x="55" y="66" width="50" height="18" rx="3" fill="url(#closed-ts)"/>
    <rect x="110" y="66" width="50" height="18" rx="3" fill="rgba(255,255,255,0.35)"/>
    <rect x="110" y="66" width="50" height="18" rx="3" fill="url(#closed-ts)"/>
  </g>
  <!-- legend -->
  <g transform="translate(20 122)">
    <rect x="0" y="-6" width="8" height="8" rx="1.5" fill="#22c55e"/>
    <text x="12" y="1" font-family="system-ui,sans-serif" font-size="7" fill="rgba(255,255,255,0.9)">Selected</text>
    <rect x="52" y="-6" width="8" height="8" rx="1.5" fill="#f97316"/>
    <text x="64" y="1" font-family="system-ui,sans-serif" font-size="7" fill="rgba(255,255,255,0.9)">Booked</text>
    <rect x="98" y="-6" width="8" height="8" rx="1.5" fill="rgba(255,255,255,0.35)"/>
    <rect x="98" y="-6" width="8" height="8" rx="1.5" fill="url(#closed-ts)"/>
    <text x="110" y="1" font-family="system-ui,sans-serif" font-size="7" fill="rgba(255,255,255,0.9)">Closed</text>
  </g>
</svg>
