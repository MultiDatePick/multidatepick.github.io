      <rect x="6" y="29" width="16" height="4" rx="1"/><rect x="26" y="29" width="52" height="4" rx="1" fill="rgba(255,255,255,0.55)"/>
      <rect x="6" y="39" width="16" height="4" rx="1"/><rect x="26" y="39" width="38" height="4" rx="1" fill="rgba(255,255,255,0.55)"/>
