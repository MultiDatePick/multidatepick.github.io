<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140" role="img" aria-label="Five calendar views: month grid, timeline, week, utilization heatmap, agenda">
  <defs>
    <linearGradient id="bg-fcv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0176d3"/>
      <stop offset="1" stop-color="#032e61"/>
    </linearGradient>
  </defs>
  <rect width="200" height="140" fill="url(#bg-fcv)"/>
  <!-- month grid tile -->
  <g transform="translate(14 14)" opacity="0.95">
    <rect width="52" height="42" rx="4" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.35)"/>
    <g fill="rgba(255,255,255,0.7)">
      <rect x="5" y="7" width="6" height="5" rx="1"/><rect x="14" y="7" width="6" height="5" rx="1"/><rect x="23" y="7" width="6" height="5" rx="1"/><rect x="32" y="7" width="6" height="5" rx="1"/><rect x="41" y="7" width="6" height="5" rx="1"/>
      <rect x="5" y="15" width="6" height="5" rx="1"/><rect x="14" y="15" width="6" height="5" rx="1" fill="#ffffff"/><rect x="23" y="15" width="6" height="5" rx="1"/><rect x="32" y="15" width="6" height="5" rx="1" fill="#ffffff"/><rect x="41" y="15" width="6" height="5" rx="1"/>
      <rect x="5" y="23" width="6" height="5" rx="1" fill="#ffffff"/><rect x="14" y="23" width="6" height="5" rx="1"/><rect x="23" y="23" width="6" height="5" rx="1"/><rect x="32" y="23" width="6" height="5" rx="1"/><rect x="41" y="23" width="6" height="5" rx="1" fill="#ffffff"/>
      <rect x="5" y="31" width="6" height="5" rx="1"/><rect x="14" y="31" width="6" height="5" rx="1"/><rect x="23" y="31" width="6" height="5" rx="1" fill="#ffffff"/><rect x="32" y="31" width="6" height="5" rx="1"/><rect x="41" y="31" width="6" height="5" rx="1"/>
    </g>
  </g>
  <!-- timeline tile -->
  <g transform="translate(72 14)" opacity="0.95">
    <rect width="52" height="42" rx="4" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.35)"/>
    <rect x="5" y="9" width="18" height="5" rx="2" fill="#ffffff"/>
    <rect x="26" y="9" width="10" height="5" rx="2" fill="rgba(255,255,255,0.6)"/>
    <rect x="5" y="18" width="8" height="5" rx="2" fill="rgba(255,255,255,0.6)"/>
    <rect x="16" y="18" width="24" height="5" rx="2" fill="#ffffff"/>
