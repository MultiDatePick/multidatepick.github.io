      <rect x="6" y="19" width="10" height="10" rx="1.5" fill="rgba(255,255,255,0.35)"/><rect x="18" y="19" width="10" height="10" rx="1.5" fill="rgba(255,255,255,0.95)"/><rect x="30" y="19" width="10" height="10" rx="1.5" fill="rgba(255,255,255,0.55)"/><rect x="42" y="19" width="10" height="10" rx="1.5" fill="rgba(255,255,255,0.75)"/><rect x="54" y="19" width="10" height="10" rx="1.5" fill="rgba(255,255,255,0.35)"/><rect x="66" y="19" width="10" height="10" rx="1.5" fill="rgba(255,255,255,0.9)"/>
      <rect x="6" y="31" width="10" height="10" rx="1.5" fill="rgba(255,255,255,0.75)"/><rect x="18" y="31" width="10" height="10" rx="1.5" fill="rgba(255,255,255,0.35)"/><rect x="30" y="31" width="10" height="10" rx="1.5" fill="rgba(255,255,255,0.95)"/><rect x="42" y="31" width="10" height="10" rx="1.5" fill="rgba(255,255,255,0.55)"/><rect x="54" y="31" width="10" height="10" rx="1.5" fill="rgba(255,255,255,0.75)"/><rect x="66" y="31" width="10" height="10" rx="1.5" fill="rgba(255,255,255,0.35)"/>
