<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140" role="img" aria-label="Accessibility: a keyboard Tab key with visible focus ring on a calendar cell and screen-reader indicator">
  <defs>
    <linearGradient id="bg-vp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0176d3"/>
      <stop offset="1" stop-color="#032e61"/>
    </linearGradient>
  </defs>
  <rect width="200" height="140" fill="url(#bg-vp)"/>
  <!-- keyboard TAB key -->
  <g transform="translate(18 26)">
    <rect width="52" height="42" rx="6" fill="rgba(255,255,255,0.98)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
    <rect y="4" width="52" height="34" rx="4" fill="rgba(255,255,255,0.15)"/>
    <text x="26" y="27" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#032e61" text-anchor="middle" letter-spacing="1.5">TAB</text>
    <!-- arrow -->
    <g transform="translate(56 21)" fill="#ffffff">
      <path d="M0 0 L14 0 L14 -3 L20 2 L14 7 L14 4 L0 4 Z" opacity="0.9"/>
    </g>
  </g>
  <!-- Calendar cell with focus ring -->
  <g transform="translate(102 22)">
    <rect width="80" height="60" rx="6" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.35)"/>
    <g fill="rgba(255,255,255,0.5)">
      <rect x="6" y="8" width="10" height="8" rx="1.5"/><rect x="18" y="8" width="10" height="8" rx="1.5"/><rect x="30" y="8" width="10" height="8" rx="1.5"/><rect x="42" y="8" width="10" height="8" rx="1.5"/><rect x="54" y="8" width="10" height="8" rx="1.5"/><rect x="66" y="8" width="8" height="8" rx="1.5"/>
      <rect x="6" y="18" width="10" height="8" rx="1.5"/><rect x="18" y="18" width="10" height="8" rx="1.5"/><rect x="30" y="18" width="10" height="8" rx="1.5"/><rect x="42" y="18" width="10" height="8" rx="1.5"/><rect x="54" y="18" width="10" height="8" rx="1.5"/><rect x="66" y="18" width="8" height="8" rx="1.5"/>
      <rect x="6" y="28" width="10" height="8" rx="1.5"/><rect x="18" y="28" width="10" height="8" rx="1.5"/><rect x="42" y="28" width="10" height="8" rx="1.5"/><rect x="54" y="28" width="10" height="8" rx="1.5"/><rect x="66" y="28" width="8" height="8" rx="1.5"/>
      <rect x="6" y="38" width="10" height="8" rx="1.5"/><rect x="18" y="38" width="10" height="8" rx="1.5"/><rect x="30" y="38" width="10" height="8" rx="1.5"/><rect x="42" y="38" width="10" height="8" rx="1.5"/><rect x="54" y="38" width="10" height="8" rx="1.5"/><rect x="66" y="38" width="8" height="8" rx="1.5"/>
    </g>
    <!-- focus ring on one cell -->
    <rect x="30" y="28" width="10" height="8" rx="1.5" fill="#ffffff"/>
    <rect x="28" y="26" width="14" height="12" rx="2.5" fill="none" stroke="#22c55e" stroke-width="2.2"/>
  </g>
  <!-- WCAG label -->
  <g transform="translate(18 96)">
    <rect width="164" height="26" rx="4" fill="rgba(255,255,255,0.94)"/>
    <g fill="#22c55e" transform="translate(10 13)">
      <circle r="7"/>
      <path d="M-4 0 L-1 3 L4 -3" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="26" y="17" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#032e61">WCAG 2.1 AA</text>
    <text x="97" y="17" font-family="system-ui,sans-serif" font-size="8.5" fill="#55606d">keyboard + screen reader</text>
  </g>
</svg>
