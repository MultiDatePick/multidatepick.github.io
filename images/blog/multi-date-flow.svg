<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140" role="img" aria-label="Salesforce Screen Flow with a MultiDatePick component returning a collection of selected dates">
  <defs>
    <linearGradient id="bg-mdf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0176d3"/>
      <stop offset="1" stop-color="#032e61"/>
    </linearGradient>
  </defs>
  <rect width="200" height="140" fill="url(#bg-mdf)"/>
  <!-- flow chrome -->
  <g transform="translate(14 16)">
    <!-- Screen node -->
    <rect width="80" height="42" rx="4" fill="rgba(255,255,255,0.96)" stroke="rgba(255,255,255,0.55)"/>
    <rect y="0" width="80" height="10" rx="4" fill="#0176d3"/>
    <rect y="4" width="80" height="6" fill="#0176d3"/>
    <text x="40" y="8" font-family="system-ui,sans-serif" font-size="6.5" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="0.5">SCREEN</text>
    <!-- mini calendar inside screen -->
    <g transform="translate(6 14)" fill="#0176d3">
      <rect width="68" height="22" rx="2" fill="#eff6ff"/>
      <g>
        <rect x="3" y="3" width="4" height="3" rx="0.5" opacity="0.3"/><rect x="9" y="3" width="4" height="3" rx="0.5"/>
        <rect x="15" y="3" width="4" height="3" rx="0.5" opacity="0.3"/><rect x="21" y="3" width="4" height="3" rx="0.5"/>
        <rect x="27" y="3" width="4" height="3" rx="0.5"/><rect x="33" y="3" width="4" height="3" rx="0.5" opacity="0.3"/>
        <rect x="39" y="3" width="4" height="3" rx="0.5" opacity="0.3"/><rect x="45" y="3" width="4" height="3" rx="0.5"/>
        <rect x="51" y="3" width="4" height="3" rx="0.5"/><rect x="57" y="3" width="4" height="3" rx="0.5" opacity="0.3"/>
        <rect x="63" y="3" width="4" height="3" rx="0.5" opacity="0.3"/>
        <rect x="3" y="9" width="4" height="3" rx="0.5"/><rect x="9" y="9" width="4" height="3" rx="0.5" opacity="0.3"/>
        <rect x="15" y="9" width="4" height="3" rx="0.5"/><rect x="21" y="9" width="4" height="3" rx="0.5" opacity="0.3"/>
        <rect x="27" y="9" width="4" height="3" rx="0.5" opacity="0.3"/><rect x="33" y="9" width="4" height="3" rx="0.5"/>
        <rect x="39" y="9" width="4" height="3" rx="0.5"/><rect x="45" y="9" width="4" height="3" rx="0.5" opacity="0.3"/>
        <rect x="51" y="9" width="4" height="3" rx="0.5" opacity="0.3"/><rect x="57" y="9" width="4" height="3" rx="0.5"/>
        <rect x="63" y="9" width="4" height="3" rx="0.5"/>
        <rect x="3" y="15" width="4" height="3" rx="0.5" opacity="0.3"/><rect x="9" y="15" width="4" height="3" rx="0.5"/>
        <rect x="15" y="15" width="4" height="3" rx="0.5"/><rect x="21" y="15" width="4" height="3" rx="0.5"/>
        <rect x="27" y="15" width="4" height="3" rx="0.5" opacity="0.3"/><rect x="33" y="15" width="4" height="3" rx="0.5" opacity="0.3"/>
        <rect x="39" y="15" width="4" height="3" rx="0.5"/>
      </g>
    </g>
  </g>
  <!-- Arrow -->
  <g transform="translate(96 34)">
    <path d="M0 3 L14 3 L14 0 L20 5 L14 10 L14 7 L0 7 Z" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- Loop node -->
  <g transform="translate(120 16)">
    <rect width="66" height="42" rx="4" fill="rgba(255,255,255,0.96)" stroke="rgba(255,255,255,0.55)"/>
    <rect y="0" width="66" height="10" rx="4" fill="#f97316"/>
    <rect y="4" width="66" height="6" fill="#f97316"/>
    <text x="33" y="8" font-family="system-ui,sans-serif" font-size="6.5" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="0.5">LOOP</text>
    <text x="33" y="26" font-family="'Menlo','JetBrains Mono',monospace" font-size="7.5" fill="#032e61" text-anchor="middle" font-weight="600">fromDate</text>
    <text x="33" y="35" font-family="'Menlo','JetBrains Mono',monospace" font-size="7.5" fill="#032e61" text-anchor="middle" font-weight="600">toDate</text>
  </g>
  <!-- Down arrow -->
  <g transform="translate(146 62)">
    <path d="M3 0 L3 14 L0 14 L5 20 L10 14 L7 14 L7 0 Z" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- Create Record node -->
  <g transform="translate(60 90)">
    <rect width="80" height="34" rx="4" fill="rgba(255,255,255,0.96)" stroke="rgba(255,255,255,0.55)"/>
    <rect y="0" width="80" height="10" rx="4" fill="#22c55e"/>
    <rect y="4" width="80" height="6" fill="#22c55e"/>
    <text x="40" y="8" font-family="system-ui,sans-serif" font-size="6.5" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="0.5">CREATE</text>
    <text x="40" y="24" font-family="system-ui,sans-serif" font-size="8" fill="#032e61" text-anchor="middle" font-weight="600">Appointment__c</text>
  </g>
</svg>
